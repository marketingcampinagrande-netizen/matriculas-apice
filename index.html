<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrículas Ápice</title>
<meta name="theme-color" content="#1F78B4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matrículas Ápice">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#FFFFFF;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#4B4B4D}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#FFFFFF}
  #abertura{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#FFFFFF;transition:opacity .4s;z-index:2}
  #abertura img{width:min(55vw,240px);height:auto}
  .barra{width:140px;height:4px;border-radius:4px;background:#E3E8ED;overflow:hidden}
  .barra i{display:block;width:40%;height:100%;background:#1F78B4;border-radius:4px;animation:vai 1.1s ease-in-out infinite}
  @keyframes vai{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #msg{font-size:14px;color:#6B7178;text-align:center;padding:0 24px;max-width:440px;line-height:1.5}
  #msg button,#msg a{display:inline-block;margin:12px 6px 0;font:bold 15px Arial,sans-serif;padding:12px 20px;border-radius:8px;border:0;background:#1F78B4;color:#fff;text-decoration:none;cursor:pointer}
  #msg a{background:#EAEFF3;color:#4B4B4D}
  #offline{display:none;position:fixed;left:0;right:0;top:0;padding:10px;text-align:center;background:#B84242;color:#fff;font-size:14px;font-weight:bold;z-index:3}
</style>
</head>
<body>
<div id="offline">Sem internet. O sistema volta a funcionar quando a conexão retornar.</div>
<div id="abertura">
  <img src="logo-abertura.png" alt="Ápice Pós-Graduação em Odontologia">
  <div class="barra"><i></i></div>
  <div id="msg">Carregando sistema de matrículas…</div>
</div>
<script src="config.js"></script>
<script>
  const ab = document.getElementById('abertura'), msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\/.+\/exec(\?.*)?$/.test(LINK_DO_APP.trim())) {
    msg.innerHTML = 'Falta configurar o link do sistema.<br>Edite o arquivo <b>config.js</b> e cole o link que termina em <b>/exec</b>.';
    document.querySelector('.barra').style.display = 'none';
  } else {
    const f = document.createElement('iframe');
    f.src = LINK_DO_APP;
    f.title = 'Sistema de Matrículas Ápice';
    f.allow = 'clipboard-read; clipboard-write';
    f.onload = () => { ab.style.opacity = 0; setTimeout(() => ab.remove(), 450); };
    document.body.appendChild(f);
    setTimeout(() => {
      if (document.body.contains(ab)) {
        msg.innerHTML = 'Está demorando mais que o normal.<br>' +
          '<button onclick="location.reload()">Tentar de novo</button>' +
          '<a href="' + LINK_DO_APP + '" target="_blank" rel="noopener">Abrir no navegador</a>';
      }
    }, 20000);
  }
  const net = () => document.getElementById('offline').style.display = navigator.onLine ? 'none' : 'block';
  addEventListener('online', net); addEventListener('offline', net); net();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
